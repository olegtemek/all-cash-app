name: all-cash

x-service: &service
  build: ./backend
  image: all-cash-server
  pull_policy: build
  env_file: .env
  working_dir: /app
  user: "${DOCKER_USER:-10001:10001}"
  volumes:
    - ${DATA_DIR:-./data}:/app/data

services:
  migrate:
    <<: *service
    command: migrate
    restart: "no"

  server:
    <<: *service
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${SERVER_PORT:-8000}:${SERVER_PORT:-8000}"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - "http://127.0.0.1:${SERVER_PORT:-8000}/health" || exit 1
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    stop_grace_period: 15s
    restart: unless-stopped

  web:
    build: ./web-client
    image: all-cash-web
    pull_policy: build
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    restart: unless-stopped

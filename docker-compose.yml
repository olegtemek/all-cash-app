name: all-cash

services:
  server:
    build: ./server
    env_file: .env
    working_dir: /app
    user: "${ALL_CASH_DOCKER_USER:-10001:10001}"
    volumes:
      - ${ALL_CASH_DATA_DIR:-./data}:/app/data
    ports:
      - "${ALL_CASH_BIND_ADDRESS:-127.0.0.1}:${ALL_CASH_SERVER_PORT:-8000}:${ALL_CASH_SERVER_PORT:-8000}"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - "http://127.0.0.1:${ALL_CASH_SERVER_PORT:-8000}/health" || exit 1
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    stop_grace_period: 15s
    restart: unless-stopped

  web:
    build: ./pwa-mobile-client
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${ALL_CASH_BIND_ADDRESS:-127.0.0.1}:${ALL_CASH_WEB_PORT:-8081}:80"
    restart: unless-stopped
